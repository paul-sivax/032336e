server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://orchestrator:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location = /a2a {
        proxy_pass http://orchestrator:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location = /.well-known/agent-card.json {
        proxy_pass http://orchestrator:8010;
        proxy_set_header Host $host;
    }
    location / { try_files $uri /index.html; }
}
